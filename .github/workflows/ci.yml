name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'compat/**'
      - 'dev/**'
      - 'next/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: codekin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alpha:
    name: DSH Alpha.5 (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 22
          - 24
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Codekin
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install Codekin dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check Codekin
        run: pnpm check

      - name: Verify committed GitHub-install artifacts
        run: git diff --exit-code -- lib

  lifecycle:
    name: Installed DSH lifecycle (Node 22)
    needs: alpha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Codekin
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install lifecycle test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify isolated tarball install, restart, removal, and reinstall
        run: node tools/dsh-lifecycle.ts --json

      - name: Verify Git commit installation lifecycle
        if: github.event_name == 'push'
        run: node tools/dsh-lifecycle.ts --source "https://github.com/${GITHUB_REPOSITORY}.git#${GITHUB_SHA}" --json
