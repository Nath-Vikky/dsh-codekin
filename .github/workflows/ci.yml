name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'compat/**'
      - 'next/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: codekin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alpha:
    name: DSH Alpha.2 (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 22
          - 24
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Codekin
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install Codekin dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check Codekin
        run: pnpm check

      - name: Verify committed GitHub-install artifacts
        run: git diff --exit-code -- lib
